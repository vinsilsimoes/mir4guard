<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111414" />
    <title>MIR4GUARD | Comunidade de MIR4 no Discord</title>
    <meta name="description" content="Encontre aliados, compartilhe estratégias e faça parte da comunidade MIR4GUARD no Discord." />
    <link rel="icon" type="image/svg+xml" href="/brand/emblem.svg" />
    <link rel="preload" href="/assets/cinzel-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/barlow-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/atmosphere.css" />
    <script src="/assets/gsap.min.js" defer></script>
    <script type="module" src="/scripts/main.js?v=040260d"></script>
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="discord-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.3 4.4a20 20 0 0 0-4.9-1.5l-.6 1.2a18.3 18.3 0 0 0-5.6 0l-.6-1.2a20 20 0 0 0-4.9 1.5C.6 9 .1 13.4.3 17.8a20 20 0 0 0 6 3l1.2-1.9-1.9-.9.5-.4a14.2 14.2 0 0 0 11.8 0l.5.4-1.9.9 1.2 1.9a20 20 0 0 0 6-3c.3-5.1-.8-9.4-3.4-13.4ZM8.1 15.1c-1.2 0-2.1-1.1-2.1-2.5s.9-2.5 2.1-2.5 2.2 1.1 2.1 2.5c0 1.4-.9 2.5-2.1 2.5Zm7.8 0c-1.2 0-2.1-1.1-2.1-2.5s.9-2.5 2.1-2.5 2.2 1.1 2.1 2.5c0 1.4-.9 2.5-2.1 2.5Z" /></symbol>
      <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
    </svg>
    <div class="landing">
      <div class="scene" aria-hidden="true">
        <div class="scene-camera">
        <div class="scene-art">
        <picture class="scene-picture">
          <source media="(max-width: 700px)" srcset="/assets/guardian-mobile.webp" width="1000" height="563" />
          <img src="/assets/guardian-desktop.webp" srcset="/assets/guardian-desktop.webp 1280w, /assets/guardian-wide.webp 1672w" sizes="100vw" width="1672" height="941" alt="" fetchpriority="high" />
        </picture>
        <svg class="world-effects" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <defs>
            <!-- All coordinates are traced against the original 1672 × 941 art. -->
            <filter id="water-grain" x="0" y="0" width="48" height="72" filterUnits="userSpaceOnUse">
              <feTurbulence type="fractalNoise" baseFrequency=".13 .035" numOctaves="2" seed="12" stitchTiles="stitch" />
              <feColorMatrix type="matrix" values="0 0 0 0 .78  0 0 0 0 .85  0 0 0 0 .84  0 0 0 1.6 -.45" />
            </filter>
            <pattern id="water-current" width="48" height="72" patternUnits="userSpaceOnUse">
              <rect width="48" height="72" filter="url(#water-grain)" />
            </pattern>
            <filter id="water-edge" x="-15%" y="-5%" width="130%" height="110%">
              <feGaussianBlur stdDeviation=".65" />
            </filter>
            <mask id="water-beds" maskUnits="userSpaceOnUse" x="832" y="352" width="285" height="218" style="mask-type:luminance">
              <g fill="white" filter="url(#water-edge)">
                <path d="M873 456 883 453 885 456Q872 470 870 491L867 515 857 541 846 548Q853 530 855 514L859 483Q862 466 873 456Z" />
                <path d="M879 458 883 457Q878 471 875 490L874 511 868 530 863 537 868 514 870 491Z" opacity=".65" />
                <path d="M969 453 977 451 973 457Q960 468 959 487L957 503 948 521 943 535 939 539Q944 522 950 507L953 486Q954 465 969 453Z" opacity=".72" />
                <path d="M1100 365 1104 366 1103 393 1101 413 1097 432 1094 441 1088 443 1092 430 1095 411 1097 389Z" />
                <path d="M1084 449 1100 447 1100 453Q1097 468 1090 478L1084 491 1072 498 1068 496Q1077 480 1078 467Z" />
                <path d="M1081 451 1086 451 1080 466 1076 478 1071 487 1069 487 1073 469Z" opacity=".7" />
              </g>
            </mask>
            <radialGradient id="dragon-cloud-feather">
              <stop offset="30%" stop-color="white" />
              <stop offset="68%" stop-color="white" stop-opacity=".82" />
              <stop offset="100%" stop-color="black" />
            </radialGradient>
            <mask id="dragon-sky" maskUnits="userSpaceOnUse" x="540" y="-55" width="650" height="330" style="mask-type:luminance">
              <rect x="540" y="-55" width="650" height="330" fill="url(#dragon-cloud-feather)" />
            </mask>
          </defs>
          <g class="water-flow" mask="url(#water-beds)">
            <rect x="832" y="352" width="285" height="218" fill="url(#water-current)" />
          </g>
          <g class="dragon-weather" mask="url(#dragon-sky)">
            <image class="dragon-cloud dragon-cloud-high" href="/assets/mist-wisps.webp" x="530" y="-62" width="710" height="260" />
            <image class="dragon-cloud dragon-cloud-low" href="/assets/mist-wisps.webp" x="590" y="70" width="550" height="165" />
          </g>
        </svg>
        </div>
        </div>
        <div class="scene-light"></div>
        <div class="mist mist-far"></div>
        <div class="scene-shade"></div>
        <div class="mist mist-near"></div>
        <div class="embers"></div>
        <div class="scene-vignette"></div>
      </div>
      <header class="site-header">
        <a class="brand" href="/" aria-label="MIR4GUARD — início">
          <img src="/brand/mir4guard-horizontal.svg" width="548" height="68" alt="MIR4GUARD" />
        </a>
        <div class="header-actions">
          <nav class="language-switcher" aria-label="Idioma">
            <button type="button" data-language="pt-BR" aria-label="Português" aria-pressed="true">PT</button>
            <button type="button" data-language="en" aria-label="English" aria-pressed="false">EN</button>
            <button type="button" data-language="es" aria-label="Español" aria-pressed="false">ES</button>
          </nav>
          <button type="button" class="discord-cta discord-cta-header" data-discord-position="header" aria-describedby="invite-status">
            <svg aria-hidden="true"><use href="#discord-icon" /></svg>
            <span data-copy="ctaLabel">Entrar no Discord</span>
            <svg class="cta-arrow" aria-hidden="true"><use href="#arrow-icon" /></svg>
          </button>
        </div>
      </header>
      <main id="main-content" class="hero">
        <div class="hero-content">
          <p class="eyebrow"><span aria-hidden="true"></span><span data-copy="eyebrow">COMUNIDADE DE MIR4</span></p>
          <h1><span data-copy="headline">NINGUÉM VENCE</span><br /><span class="headline-accent" data-copy="headlineAccent">SOZINHO.</span></h1>
          <div class="hero-rule" aria-hidden="true"><span></span></div>
          <p class="hero-description" data-copy="description">Encontre seus próximos aliados, compartilhe estratégias e viva MIR4 com a comunidade <strong>MIR4GUARD.</strong></p>
          <div class="hero-action">
            <button type="button" class="discord-cta discord-cta-primary" data-discord-position="hero" aria-describedby="invite-status">
              <svg aria-hidden="true"><use href="#discord-icon" /></svg>
              <span data-copy="ctaLabel">Entrar no Discord</span>
              <svg class="cta-arrow" aria-hidden="true"><use href="#arrow-icon" /></svg>
            </button>
            <p class="microcopy" data-copy="microcopy">Sua próxima jornada começa com novos aliados.</p>
            <p id="invite-status" class="invite-status" role="status" aria-live="polite"></p>
            <noscript><p class="invite-status">O convite da comunidade estará disponível em breve.</p></noscript>
          </div>
        </div>
      </main>
      <footer class="site-footer">
        <p data-copy="footer">Comunidade independente. Sem vínculo oficial com MIR4.</p>
        <div class="footer-end"><span class="footer-rule" aria-hidden="true"></span><button class="motion-toggle" type="button" aria-label="Pausar animações" title="Pausar animações" aria-pressed="false" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path class="pause-symbol" d="M7 5v10M13 5v10" /><path class="play-symbol" d="m7 5 7 5-7 5Z" /></svg></button></div>
      </footer>
    </div>
  </body>
</html>
